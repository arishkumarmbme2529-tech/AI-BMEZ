services:
  - type: web
    name: aicte-smart-platform-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aicte-postgres-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: aicte-postgres-db
    plan: free

